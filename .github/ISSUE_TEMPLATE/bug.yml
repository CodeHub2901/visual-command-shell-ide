name: Bug report
description: Report a reproducible Command IDE problem without including secrets.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["Ubuntu 24.04", "Ubuntu 26.04", "Fedora 44", "Development-only platform"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Remove credentials, terminal secrets, private paths, and file contents.
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, passwords, terminal transcripts, and identifying paths.
          required: true
