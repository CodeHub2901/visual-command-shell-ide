name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x mvnw
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Build unpacked native application
        run: pnpm pack:dir
      - name: Verify bundled runtime and language server
        run: pnpm test:packaged
