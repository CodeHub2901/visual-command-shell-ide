name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x mvnw
      - run: pnpm install --frozen-lockfile
      - name: Configure Chromium sandbox helper
        shell: bash
        run: |
          sandbox_helper="$(
            cd apps/desktop
            node -e "const path=require('node:path'); process.stdout.write(path.join(path.dirname(require('electron')), 'chrome-sandbox'))"
          )"
          test -f "$sandbox_helper"
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"
          test "$(stat --format='%U:%G %a' "$sandbox_helper")" = "root:root 4755"
      - run: pnpm verify
      - name: Build unpacked native application
        run: pnpm pack:dir
      - name: Verify bundled runtime and language server
        run: pnpm test:packaged
