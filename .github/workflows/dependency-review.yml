name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Reject newly introduced high-risk dependencies
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@40c09b7dc99638e5ddb0bfd91c1673effc064d8a # v4.8.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  private-osv-review:
    name: Reject newly introduced vulnerabilities (private repository)
    if: github.event.repository.private
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out target branch
        run: git checkout --detach "$BASE_SHA"
      - name: Scan target branch with OSV
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --format=json
            --output-file=old-results.json
            -r
            ./
      - name: Check out pull request head
        run: git checkout --detach "$HEAD_SHA"
      - name: Scan pull request dependencies with OSV
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --format=json
            --output-file=new-results.json
            -r
            ./
      - name: Reject newly introduced vulnerabilities
        run: node scripts/compare-osv-results.mjs old-results.json new-results.json
